<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVER</title>
    <link rel="stylesheet" href="style.css">
    <link rel="favicon" href="favicon.ico">
</head>
<body>
    <div id="wrap">
        <div id="wrap-center">
            <div id="header" aria-label="메인 헤더">
                 <div id="header-first">
                    <button id="header-hamburger" aria-label="메뉴"></button>
                </div>
                <div id="header-second">
                    <button id="header-pay" aria-label="네이버 페이"></button>
                </div>
                <div id="topNotiArea">
                    <button id="topNotiButton" type="button" aria-label="알림"></button>
                </div>
                  <div id="topShoppingArea">
                    <button id="topShoppingButton" type="button" aria-label="장바구니"></button>
                </div>
            </div>
            <div id="search-area" aria-label="검색">
                <form action="">
                    <a id="search-svg" href="https://www.naver.com/">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16.273 12.845 7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727v12.845z"></path></svg>
                    </a>
                    <label for="search-input" class="blind">검색어 입력</label>
                    <input id="search-input" type="text" placeholder="검색어를 입력하세요.">
                    <button type="submit" class="blind">검색</button>
            <div id="search-right">
                <div id="search-tools">
                    <button id="search-keyboard">
                        <span class="blind">입력도구</span>
                    </button>
                </div>
                <div id="search-ai-container">
                    <button id="search-ai">
                        <span class="blind">AI 검색</span>
                    </button>
                </div>
            </div>
                </form>
            </div>
            <div id="navigation" aria-label="주요 서비스">
                <ul>
                    <li>
                        <a href="#">
                            <div></div>
                            <span>메일</span>
                        </a>
                    </li>
                     <li>
                        <a href="#">
                            <div></div>
                            <span>카페</span>
                        </a>
                    </li>
                     <li>
                        <a href="#">

                        </a>
                    </li>

                        <a href="#">

                            <span>쇼핑</span>
                        </a>
                    </li>
                     <li>
                        <a href="#">
                            <div></div>
                            <span>뉴스</span>
                        </a>
                    </li>
                     <li>
                        <a href="#">
                            <div></div>

                        </a>
                    </li>
                     <li>

                    </li>
                     <li>
                        <a href="#">
                            <div></div>

                        </a>
                    </li>
                     <li>
                        <a href="#">
                            <div ></div>

                        </a>
                    </li>
                     <li>
                        <a href="#">
                            <div></div>
                            <span class="blind">더보기</span>
                        </a>
                    </li>
                </ul>
            </div>
            <div id="main"></div>
        </div>
    </div>

</html>
